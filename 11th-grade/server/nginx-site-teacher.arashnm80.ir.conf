# Static grade-11 textbook. Published copy is /var/www/teacher.arashnm80.ir
# (nginx cannot traverse /root). Refresh it with 11th-grade/deploy.sh.

server {
    listen 80;
    server_name teacher.arashnm80.ir;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name teacher.arashnm80.ir;

    ssl_certificate /etc/nginx/ssl/arashnm80.ir/certificate.crt;
    ssl_certificate_key /etc/nginx/ssl/arashnm80.ir/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # AI helper relay (11th-grade/ai-proxy/).
    include /etc/nginx/snippets/teacher-ai.conf;
    include /etc/nginx/snippets/teacher-accounts.conf;

    root /var/www/teacher.arashnm80.ir;
    index index.html;

    location = /grade11-offline.zip {
        default_type application/zip;
        add_header Content-Disposition "attachment; filename=\"grade11-offline.zip\"" always;
        try_files /grade11-offline.zip =404;
    }

    location = /teacher-playground-offline.zip {
        default_type application/zip;
        add_header Content-Disposition "attachment; filename=\"teacher-playground-offline.zip\"" always;
        try_files /teacher-playground-offline.zip =404;
    }

    # Cloud playground for home / phone (same app as the offline zip).
    location /playground/ {
        try_files $uri $uri/ /playground/index.html;
    }

    # JS/JSON must revalidate: unversioned ES imports were stuck on a broken
    # Cloudflare-cached bootlog.js for a full day after a SyntaxError fix.
    location ~* ^/playground/.*\.(js|json)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Engine parts are content-addressed (hash in name), so the edge can keep them.
    location ~* ^/playground/vendor/pyodide/chunks/.*\.bin$ {
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* ^/playground/.*\.(wasm|zip)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # The lesson pages' scripts and styles: always ask the server whether they changed (the pages
    # also name them with a build id, so a new build is fetched at once; see build_site.py).
    location ~* ^/assets/.*\.(js|css)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Pages must always revalidate: a cached page can point at old
    # versioned assets and render an outdated layout for months.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
