# AI helper relay. Included in the TLS server block of teacher.arashnm80.ir.
# The relay listens on 127.0.0.1:8787 (see teacher-ai.service).
location /api/ai/ {
    limit_req zone=teacher_ai burst=40 nodelay;
    client_max_body_size 64k;

    # The offline playground is opened from file:// (origin "null") and calls
    # this API. No cookies are used, so a wildcard origin is safe here.
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, X-AI-Key" always;
    add_header Access-Control-Max-Age "600" always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 120s;
    proxy_send_timeout 30s;
}
