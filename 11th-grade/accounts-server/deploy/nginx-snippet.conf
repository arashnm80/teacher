# /etc/nginx/snippets/teacher-accounts.conf
# Included in the TLS server block of teacher.arashnm80.ir. The accounts service listens on
# 127.0.0.1:8790 (see teacher-accounts.service). ^~ keeps the regex rules for .html and .js
# from taking these paths.
location ^~ /api/student/ {
    limit_req zone=ta_student burst=30 nodelay;
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:8790;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 30s;
}

location ^~ /api/admin/ {
    limit_req zone=ta_admin burst=10 nodelay;
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:8790;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 60s;
}

# The teacher's panel: never indexed, never framed, and a strict policy for its scripts.
location ^~ /admin/ {
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ =404;
}
