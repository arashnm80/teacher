# /etc/nginx/conf.d/teacher-accounts-zones.conf
# Rate limits for the accounts API. Behind Cloudflare the visitor's address is in
# CF-Connecting-IP; without it, the connecting address is used.
map $http_cf_connecting_ip $ta_client {
    default $http_cf_connecting_ip;
    ""      $binary_remote_addr;
}
limit_req_zone $ta_client zone=ta_student:10m rate=10r/s;
limit_req_zone $ta_client zone=ta_admin:5m rate=3r/s;
